<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پامپ‌یاب | رصد لحظه‌ای رشد بازار</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E14; --bg-elev:#111722; --card:#141B29; --card-edge:#212B3D;
    --ink:#E7ECF4; --ink-dim:#8892A6; --ink-faint:#5B6478;
    --amber:#E3A947; --amber-dim:#8A6A2E;
    --green:#39D98A; --green-dim:#1E5C43;
    --red:#F0555F; --red-dim:#5C2530;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:
      radial-gradient(1200px 500px at 90% -10%, rgba(227,169,71,0.08), transparent 60%),
      radial-gradient(900px 400px at -10% 10%, rgba(57,217,138,0.06), transparent 55%),
      var(--bg);
    color:var(--ink); font-family:'Vazirmatn',sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .num{font-family:'JetBrains Mono',monospace; direction:ltr; unicode-bidi:isolate;}
  header{
    position:sticky; top:0; z-index:20; padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 16px;
    background:rgba(10,14,20,0.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--card-edge);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  header .brand b{font-size:20px; font-weight:800;}
  header .brand span{font-size:12px; color:var(--ink-dim);}
  .pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint); flex:none;}
  .pulse-dot.live{background:var(--green); box-shadow:0 0 0 0 rgba(57,217,138,.6); animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(57,217,138,.5)}70%{box-shadow:0 0 0 8px rgba(57,217,138,0)}100%{box-shadow:0 0 0 0 rgba(57,217,138,0)}}
  .status-chip{display:flex;align-items:center;gap:7px; font-size:12px; color:var(--ink-dim); background:var(--bg-elev); border:1px solid var(--card-edge); padding:6px 12px; border-radius:999px;}
  main{max-width:820px; margin:0 auto; padding:20px 16px 60px;}
  .panel{background:var(--card); border:1px solid var(--card-edge); border-radius:var(--radius); padding:18px; margin-bottom:16px;}
  .panel h2{margin:0 0 4px; font-size:15px; font-weight:700;}
  .panel p.hint{margin:0 0 14px; font-size:12.5px; color:var(--ink-dim); line-height:1.7;}
  .thresh-row{display:flex; align-items:center; gap:14px;}
  .thresh-row input[type=range]{flex:1; accent-color:var(--amber);}
  .thresh-val{font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:var(--amber); min-width:56px; text-align:center;}
  button{font-family:'Vazirmatn',sans-serif; cursor:pointer; border:none;}
  .btn-ghost{background:transparent; border:1px solid var(--card-edge); color:var(--ink-dim); font-size:13px; padding:9px 14px; border-radius:9px;}
  .row{display:flex; gap:8px; margin-top:12px;}

  .coin-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--card); border:1px solid var(--card-edge); border-radius:12px;
    padding:13px 16px; margin-bottom:9px;
  }
  .coin-row.pump{border-color:var(--green-dim); background:linear-gradient(90deg, rgba(57,217,138,.08), transparent 60%);}
  .coin-id{display:flex; align-items:center; gap:11px;}
  .coin-id .rank{font-size:11px; color:var(--ink-faint); width:20px; text-align:center; font-family:'JetBrains Mono',monospace;}
  .coin-id b{font-size:14.5px; font-weight:700;}
  .coin-id span{font-size:11px; color:var(--ink-faint); display:block;}
  .coin-right{text-align:left;}
  .coin-right .p{font-size:13.5px; font-weight:600;}
  .coin-right .chg{font-size:15px; font-weight:800; font-family:'JetBrains Mono',monospace;}
  .up{color:var(--green);} .down{color:var(--red);} .flat{color:var(--ink-dim);}
  .badge-pump{font-size:10.5px; font-weight:800; background:var(--green-dim); color:var(--green); padding:2px 8px; border-radius:999px; margin-inline-start:6px;}

  .empty{text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:13.5px; line-height:2;}
  .toast{
    position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--card); border:1px solid var(--amber-dim); color:var(--ink); padding:12px 20px; border-radius:11px;
    font-size:13px; opacity:0; transition:.3s ease; pointer-events:none; z-index:50; max-width:88vw; text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .sectionhead{font-size:12px; color:var(--ink-faint); margin:18px 4px 8px; font-weight:600;}
</style>
</head>
<body>
<header>
  <div class="brand"><b>پامپ‌یاب</b><span>رصد رشدهای ناگهانی بازار</span></div>
  <div class="status-chip"><span class="pulse-dot" id="liveDot"></span><span id="statusText">در حال اتصال</span></div>
</header>

<main>
  <div class="panel">
    <h2>آستانه‌ی هشدار پامپ</h2>
    <p class="hint">وقتی رشد ۱ ساعته‌ی یه رمزارز از این عدد بیشتر بشه، بالای لیست میاد و بهت اعلان می‌ده. حدود ۲۵۰ رمزارز برتر بازار هر ۹۰ ثانیه چک می‌شن.</p>
    <div class="thresh-row">
      <input type="range" id="threshRange" min="3" max="20" step="0.5" value="5">
      <div class="thresh-val num" id="threshVal">5%</div>
    </div>
    <div class="row">
      <button class="btn-ghost" id="enableNotif">فعال‌سازی اعلان‌ها</button>
    </div>
  </div>

  <div class="sectionhead" id="pumpHeading" style="display:none;">🚀 در حال پامپ (بالای آستانه)</div>
  <div id="pumpList"></div>

  <div class="sectionhead">بیشترین رشد ۱ ساعته (کل بازار)</div>
  <div id="topList"><div class="empty">در حال دریافت لیست بازار…</div></div>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var POLL_MS = 90000;
  var threshold = 5;
  var notified = {}; // id -> true while above (threshold - hysteresis)
  var HYST = 1.5;

  var statusText = document.getElementById("statusText");
  var liveDot = document.getElementById("liveDot");
  var toastEl = document.getElementById("toast");
  var pumpList = document.getElementById("pumpList");
  var pumpHeading = document.getElementById("pumpHeading");
  var topList = document.getElementById("topList");

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastEl._h);
    toastEl._h = setTimeout(function(){ toastEl.classList.remove("show"); }, 3500);
  }
  function notify(title, body){
    toast(title+" — "+body);
    if("Notification" in window && Notification.permission==="granted"){
      try{ new Notification(title,{body:body, tag:title+Date.now()}); }catch(e){}
    }
  }

  var threshRange = document.getElementById("threshRange");
  var threshVal = document.getElementById("threshVal");
  threshRange.addEventListener("input", function(){
    threshold = parseFloat(threshRange.value);
    threshVal.textContent = threshold+"%";
  });

  var notifBtn = document.getElementById("enableNotif");
  function refreshNotifUI(){
    if(!("Notification" in window)){ notifBtn.style.display="none"; return; }
    if(Notification.permission==="granted"){ notifBtn.textContent="اعلان‌ها فعاله ✓"; notifBtn.disabled=true; }
    else if(Notification.permission==="denied"){ notifBtn.textContent="اعلان‌ها مسدود شده"; notifBtn.disabled=true; }
  }
  notifBtn.addEventListener("click", function(){
    Notification.requestPermission().then(function(){ refreshNotifUI(); });
  });
  refreshNotifUI();

  function fmtPrice(p){
    if(p==null||isNaN(p)) return "—";
    if(p>=1000) return p.toLocaleString("en-US",{maximumFractionDigits:0});
    if(p>=1) return p.toLocaleString("en-US",{maximumFractionDigits:2});
    return p.toLocaleString("en-US",{maximumFractionDigits:6});
  }

  function fetchMarkets(page){
    var url = "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page="+page+"&price_change_percentage=1h,24h&sparkline=false";
    return fetch(url).then(function(r){
      if(!r.ok) throw new Error("gecko_failed");
      return r.json();
    });
  }

  function rowHtml(coin, rank, isPump){
    var chg = coin.price_change_percentage_1h_in_currency;
    var chgClass = chg>0 ? "up" : (chg<0 ? "down" : "flat");
    var chgText = chg!=null ? ((chg>0?"+":"")+chg.toFixed(2)+"%") : "—";
    return '<div class="coin-row'+(isPump?' pump':'')+'">'+
      '<div class="coin-id"><span class="rank num">'+rank+'</span>'+
        '<div><b>'+coin.symbol.toUpperCase()+(isPump?'<span class="badge-pump">پامپ</span>':'')+'</b>'+
        '<span>'+coin.name+'</span></div></div>'+
      '<div class="coin-right"><div class="p num">$'+fmtPrice(coin.current_price)+'</div>'+
      '<div class="chg num '+chgClass+'">'+chgText+'</div></div></div>';
  }

  function process(coins){
    // sort by 1h change desc, ignore nulls
    var withChg = coins.filter(function(c){ return c.price_change_percentage_1h_in_currency!=null; });
    withChg.sort(function(a,b){ return b.price_change_percentage_1h_in_currency - a.price_change_percentage_1h_in_currency; });

    var pumps = withChg.filter(function(c){ return c.price_change_percentage_1h_in_currency >= threshold; });

    // notifications: fire once per crossing, reset with hysteresis
    withChg.forEach(function(c){
      var chg = c.price_change_percentage_1h_in_currency;
      if(chg >= threshold){
        if(!notified[c.id]){
          notified[c.id] = true;
          notify("🚀 پامپ "+c.symbol.toUpperCase(), c.name+" در یک ساعت اخیر "+chg.toFixed(1)+"% رشد کرده");
        }
      } else if(chg < threshold - HYST){
        notified[c.id] = false;
      }
    });

    if(pumps.length){
      pumpHeading.style.display = "";
      pumpList.innerHTML = pumps.slice(0,20).map(function(c,i){ return rowHtml(c,i+1,true); }).join("");
    } else {
      pumpHeading.style.display = "none";
      pumpList.innerHTML = "";
    }

    var top = withChg.slice(0,30);
    topList.innerHTML = top.map(function(c,i){ return rowHtml(c,i+1,false); }).join("");
  }

  function refresh(){
    statusText.textContent = "در حال به‌روزرسانی…";
    liveDot.classList.remove("live");
    return fetchMarkets(1).then(function(page1){
      return fetchMarkets(2).then(function(page2){
        process(page1.concat(page2));
        statusText.textContent = "به‌روز · هر ۹۰ ثانیه";
        liveDot.classList.add("live");
      });
    }).catch(function(){
      statusText.textContent = "خطا در دریافت — دوباره تلاش می‌شه";
      topList.innerHTML = '<div class="empty">دریافت لیست بازار ناموفق بود. اتصال اینترنت یا فیلترینگ رو چک کن؛ خودکار دوباره امتحان می‌شه.</div>';
    });
  }

  refresh();
  setInterval(refresh, POLL_MS);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState==="visible") refresh();
  });
})();
</script>
</body>
</html>
